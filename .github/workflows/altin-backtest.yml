name: Altın Robotu geçmiş testi
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["altin/bot/strategy.mjs", "altin/bot/backtest.mjs", "altin/bot/data.mjs", ".github/workflows/altin-backtest.yml"]
permissions:
  contents: write
concurrency:
  group: altin-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 1000 TL ile 90 gün
        run: node altin/tests/strategy.test.mjs && node altin/bot/backtest.mjs
      - name: Sonucu kaydet
        run: |
          git config user.name "altin-robot-bot"
          git config user.email "altin-robot-bot@users.noreply.github.com"
          git add altin/bot/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "altın: geçmiş test sonucu [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 6; done
