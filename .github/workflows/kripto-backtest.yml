name: Kripto Radar geçmiş veri testi
on:
  workflow_dispatch:
  push:
    paths: ["bot/config.json", "bot/strategy.mjs", "bot/backtest.mjs"]
permissions:
  contents: write
concurrency:
  group: kripto-radar
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Son 60 günü test et
        run: node bot/backtest.mjs
      - name: Sonucu kaydet
        run: |
          git config user.name "kripto-radar-bot"
          git config user.email "kripto-radar-bot@users.noreply.github.com"
          git add bot/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "radar: geçmiş veri testi [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
