<title>Saha Satış Defteri</title>

<meta name="description" content="Yedek parça saha satışı: müşteri, ziyaret, sipariş ve rota">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: navy app bar + white rounded cards on a cool sky background, bottom tab bar with a centre quick-action button */
:root{
  --bg:#f2f6fb; --surface:#ffffff; --sunk:#e9f0f8; --line:#d8e2ee;
  --ink:#0b1d4a; --muted:#5a6b86; --accent:#048cfc; --accent-ink:#ffffff; --cta:#a4e22b; --cta-ink:#0b1d4a; --cta-press:#8fcc17;
  --steel:#0b1d4a; --navy:#0b1d4a; --navy2:#132b6b; --ok:#0f9d6b; --warn:#c27a00; --bad:#e0293a;
  --ok-bg:#dcf5ea; --warn-bg:#fff1d6; --bad-bg:#fde3e5; --steel-bg:#e3effd;
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07112b; --surface:#0f1d42; --sunk:#16275a; --line:#22356c;
  --ink:#eef3ff; --muted:#9db0d6; --accent:#2fa2ff; --accent-ink:#04122e; --cta:#b2ef3a; --cta-ink:#07112b; --cta-press:#9edc22;
  --steel:#cfe0ff; --navy:#050d24; --navy2:#0c1a45; --ok:#3fd69a; --warn:#ffbf47; --bad:#ff6b77;
  --ok-bg:#0f3a2c; --warn-bg:#3d2c08; --bad-bg:#43141c; --steel-bg:#15306a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07112b; --surface:#0f1d42; --sunk:#16275a; --line:#22356c;
  --ink:#eef3ff; --muted:#9db0d6; --accent:#2fa2ff; --accent-ink:#04122e; --cta:#b2ef3a; --cta-ink:#07112b; --cta-press:#9edc22;
  --steel:#cfe0ff; --navy:#050d24; --navy2:#0c1a45; --ok:#3fd69a; --warn:#ffbf47; --bad:#ff6b77;
  --ok-bg:#0f3a2c; --warn-bg:#3d2c08; --bad-bg:#43141c; --steel-bg:#15306a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(11,29,74,.18)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px 16px}
.emblem{width:40px;height:40px;border-radius:12px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-size:12px;font-weight:500;opacity:.75;letter-spacing:0}
.sync{margin-left:auto;font-size:11px;opacity:.8;text-align:right}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px rgba(11,29,74,.08)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:var(--nav-h)}
nav.bottom button{background:none;border:0;color:var(--muted);font:600 11px var(--f-body);display:grid;justify-items:center;gap:3px;padding:8px 0 10px;cursor:pointer}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button[aria-selected="true"]{color:var(--accent)}
nav.bottom .fab{width:58px;height:58px;border-radius:50%;background:var(--cta);color:var(--cta-ink);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 8px 20px rgba(120,180,20,.45);border:4px solid var(--surface);padding:0}
nav.bottom .fab svg{width:28px;height:28px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,13,36,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto;display:grid;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa button{background:var(--sunk);border:0;border-radius:16px;padding:14px 8px;display:grid;justify-items:center;gap:8px;color:var(--ink);font:600 13px var(--f-body);cursor:pointer;text-align:center}
.qa .ic{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.qa .ic svg{width:22px;height:22px}
.hero{background:linear-gradient(135deg,var(--accent),#2b6cff);color:#fff;border-radius:20px;padding:16px;display:grid;gap:6px}
.hero .big{font:700 26px var(--f-mono);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.lines .ln{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}.qty button{width:34px;height:32px;border:0;background:var(--sunk);color:var(--ink);font-size:18px;cursor:pointer}.qty span{min-width:34px;text-align:center;font-family:var(--f-mono)}
@media (max-width:480px){.sync{display:none}.brand{font-size:17px}.top .wrap{padding-block:10px 12px}}
/* telefonda tablolar kart görünümüne geçer, yana kaydırma gerekmez */
@media (max-width:560px){
 .tbl.rt{border:0;background:none;overflow:visible}
 .tbl.rt table,.tbl.rt tbody,.tbl.rt tr,.tbl.rt td{display:block;width:100%}
 .tbl.rt thead{display:none}
 .tbl.rt tr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
 .tbl.rt td{border:0;padding:4px 0;white-space:normal;display:flex;justify-content:space-between;gap:12px;text-align:right}
 .tbl.rt td::before{content:attr(data-l);color:var(--muted);font:600 12px var(--f-body);text-align:left;flex:none}
 .tbl.rt td[data-l=""]::before{content:none}
 .tbl.rt td:first-child{font-weight:700;font-size:15px}
}
main{padding-block:18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:700;font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0;box-shadow:0 2px 10px rgba(11,29,74,.04)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.btn{font:700 14px/1 var(--f-body);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}.btn.pri:active{background:var(--cta-press)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.bottom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;min-width:0}
.item .t{font-weight:600;font-size:16px}
.list>.item{content-visibility:auto;contain-intrinsic-size:auto 110px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:5px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.st{background:var(--steel-bg);color:var(--steel)}
.chip.nc{text-transform:none;letter-spacing:0;font-size:12px}
.note{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.stop .num{width:30px;height:30px;border-radius:50%;background:var(--steel);color:var(--surface);font:600 14px var(--f-mono);display:grid;place-items:center}
.stop .num.x{background:var(--sunk);color:var(--muted)}
@media (max-width:560px){.stop{grid-template-columns:34px minmax(0,1fr)}.stop>.row,.stop>.btn,.stop>a{grid-column:2;justify-self:start}
 .kpi .v{font-size:17px;white-space:nowrap}}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.check input{width:20px;height:20px;flex:none}
svg.map{width:100%;height:auto;max-width:100%;display:block;background:var(--sunk);border-radius:8px}
.toast{display:flex;align-items:center;gap:4px;max-width:calc(100% - 32px);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px}
.sub{color:var(--muted);font-size:14px;max-width:65ch}
.live{border-left:4px solid var(--accent)}
.muted{color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.bar.ok>i{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;min-height:32px}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mapbox{position:relative;touch-action:none;user-select:none}
.mapbox svg{width:100%;height:auto;display:block;background:var(--sunk);border-radius:var(--r);border:1px solid var(--line);cursor:grab}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapctl .btn{width:40px;justify-content:center;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tier{font:600 12px var(--f-mono);width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;background:var(--sunk);color:var(--muted)}
.tier.A{background:var(--accent);color:var(--accent-ink)}.tier.B{background:var(--steel-bg);color:var(--steel)}
.funnel{display:grid;gap:6px}.funnel .r{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.pipe{display:flex;flex-wrap:wrap;gap:4px}
.pipe button{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 10px;border-radius:6px;cursor:pointer}
.pipe button{border-radius:999px}.pipe button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.why{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.item,.panel{transition:border-color .15s}}
</style>
</head><body>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trLow=s=>String(s??"").toLocaleLowerCase("tr-TR").replace(/\s+/g," ").trim();
const tl=n=>(Number(n)||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const nowTime=()=>new Date().toTimeString().slice(0,5);
const fmtDate=s=>{if(!s)return "—";const [y,m,d]=s.split("-");return d&&m?`${d}.${m}.${y}`:s};
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m,o){const t=$("#toast");t.textContent=m;if(o&&o.fn){const b=document.createElement("button");b.className="btn sm";b.style.cssText="margin-left:10px;background:var(--cta);border-color:var(--cta);color:var(--cta-ink);min-height:30px";b.textContent=o.label||"Tamam";b.onclick=()=>{t.hidden=true;o.fn()};t.appendChild(b)}
  t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,(o&&o.ms)||2600)}
function parseNum(v){if(typeof v==="number")return v;let s=String(v??"").replace(/[^\d,.\-]/g,"");if(!s)return 0;
  if(s.includes(",")&&s.includes(".")){s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(s.includes(",")){s=s.replace(",",".")}
  else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s)){s=s.replace(/\./g,"")}
  return parseFloat(s)||0}
function parseDate(v){if(v instanceof Date&&!isNaN(v)){return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0")}
  if(typeof v==="number"&&window.XLSX){const o=XLSX.SSF.parse_date_code(v);if(o)return `${o.y}-${String(o.m).padStart(2,"0")}-${String(o.d).padStart(2,"0")}`}
  const s=String(v??"").trim();let m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];return ""}
function parseCoords(s){s=String(s||"");let m=s.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/)||s.match(/[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/^\s*(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)\s*$/);
  if(!m)return null;const lat=parseFloat(m[1]),lng=parseFloat(m[2]);if(Math.abs(lat)>90||Math.abs(lng)>180)return null;return {lat,lng}}
const hasGeo=c=>c&&typeof c.lat==="number"&&typeof c.lng==="number";
function km(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const placeStr=c=>hasGeo(c)?`${c.lat},${c.lng}`:[c.address,c.city].filter(Boolean).join(", ");
const mapsLink=c=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(placeStr(c)||c.name);
function phoneHref(p){return "tel:"+String(p||"").replace(/[^\d+]/g,"")}

const S={customers:new Map(),visits:new Map(),orders:new Map(),settings:new Map(),products:new Map(),mode:"yükleniyor",ready:false};

let _lsT=null;function lsSave(){clearTimeout(_lsT);_lsT=setTimeout(lsSaveNow,250)}
function lsFlush(){if(_lsT){clearTimeout(_lsT);_lsT=null;lsSaveNow()}}
addEventListener("pagehide",lsFlush);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")lsFlush()});
function lsSaveNow(){_lsT=null;try{localStorage.setItem(LSK,JSON.stringify([...S.customers.values(),...S.visits.values(),...S.orders.values(),...S.settings.values(),...S.products.values()]));U&&(U.storeFull=false)}
  catch(e){if(typeof U!=="undefined"&&!U.storeFull){U.storeFull=true;setTimeout(()=>toast("⚠ Telefon hafızası doldu, son değişiklik kaydedilemedi. Rapor → Yedek al, sonra eski fatura/sipariş kayıtlarını sil."),50)}}}
function bucket(k){return k==="customer"?S.customers:k==="visit"?S.visits:k==="setting"?S.settings:k==="product"?S.products:S.orders}
let DV=0;function put(d){if(d&&d.id&&d.kind){bucket(d.kind).set(d.id,d);DV++}}
async function save(d){put(d);render();lsSave();if(typeof CLOUD!=="undefined"&&CLOUD.col)cloudPush([d])}

/* indexes rebuilt only when data changes (DV) or the day changes */
let IX={v:-1};const COLL=new Intl.Collator("tr");
function ix(){const t=today();if(IX.v===DV&&IX.t===t)return IX;
  const cl=[...S.customers.values()].sort((a,b)=>COLL.compare(a.name||"",b.name||""));
  const byName=new Map();cl.forEach(c=>byName.set(trLow(c.name),c));
  const vb=new Map();for(const v of S.visits.values()){let a=vb.get(v.customerId);if(!a)vb.set(v.customerId,a=[]);a.push(v)}
  vb.forEach(a=>a.sort((x,y)=>((y.date||"")+(y.start||"")).localeCompare((x.date||"")+(x.start||""))));
  const ob=new Map();for(const o of S.orders.values()){const c=o.customerId&&S.customers.get(o.customerId)||byName.get(trLow(o.customer));if(!c)continue;let a=ob.get(c.id);if(!a)ob.set(c.id,a=[]);a.push(o)}
  const rev=new Map();ob.forEach((a,k)=>rev.set(k,a.reduce((s,o)=>s+(o.amount||0),0)));
  IX={v:DV,t,cl,byName,vb,ob,rev,pri:new Map()};return IX}
const custList=()=>ix().cl.slice();
const custByName=n=>ix().byName.get(trLow(n));
const visitsOf=c=>ix().vb.get(c.id)||[];
const ordersOf=c=>ix().ob.get(c.id)||[];
const lastVisit=c=>visitsOf(c)[0];
const STATUS=["Aday","Görüşülüyor","Teklif","Aktif","Pasif"];
const STATUS_COL={"Aday":"var(--muted)","Görüşülüyor":"var(--steel)","Teklif":"var(--warn)","Aktif":"var(--ok)","Pasif":"var(--bad)"};
const STATUS_CHIP={"Aday":"","Görüşülüyor":"st","Teklif":"warn","Aktif":"ok","Pasif":"bad"};
const TIERS={A:"A · güçlü toptan",B:"B · orta",C:"C · küçük"};
const TYPES=["Toptancı","Perakende parçacı","Servis / tamirhane","Filo / kurumsal","Online satıcı","Diğer"];
const BRANDS=["Ford","Fiat","PSA","Renault","VAG","Toyota","Hyundai","Diğer"];
const settings=()=>S.settings.get("setting_main")||{id:"setting_main",kind:"setting",target:0};
function waLink(p){let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="90"+d.slice(1);else if(d.length===10)d="90"+d;return d.length>=11?"https://wa.me/"+d:""}
function daysSince(d){if(!d)return null;return Math.round((new Date(today()+"T00:00")-new Date(d+"T00:00"))/864e5)}
function custRevenue(c){return ix().rev.get(c.id)||0}
function priority(c){const I=ix();const hit=I.pri.get(c.id);if(hit)return hit;const r=priority0(c);I.pri.set(c.id,r);return r}
function priority0(c){const t=today();let sc=0,why=[];
  const tw={A:30,B:16,C:6}[c.tier||"C"];sc+=tw;if(c.tier==="A")why.push("A potansiyel");
  const sw={"Teklif":22,"Görüşülüyor":12,"Aktif":10,"Aday":8,"Pasif":0}[c.status||"Aday"];sc+=sw;if(c.status==="Teklif")why.push("açık teklif");
  if(c.type==="Toptancı"){sc+=10;why.push("toptancı")}
  const est=Number(c.estMonthly)||0;if(est){sc+=Math.min(20,est/25000);if(est>=100000)why.push("~"+Math.round(est/1000)+"b ₺/ay")}
  if(c.nextVisit&&c.nextVisit<=t){const od=daysSince(c.nextVisit);sc+=Math.min(25,6+od*1.5);why.push(od?od+" gün gecikti":"ziyaret günü")}
  const lv=lastVisit(c);if(!lv&&c.status!=="Pasif"){sc+=6;why.push("hiç ziyaret yok")}
  if(c.status==="Pasif")sc-=20;return {score:Math.round(sc),why}}
const RESULTS={"Sipariş alındı":"ok","Teklif verildi":"st","Bilgi / tanıtım":"","Tahsilat":"ok","Şikayet":"bad","Ulaşılamadı":"warn"};

  const MORE=["harita","ziyaret","siparis","asistan","rapor","yakin","gunsonu","daha","stok"];document.querySelectorAll("nav.bottom [data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===U.tab||(b.dataset.tab==="daha"&&MORE.includes(U.tab))));

  renderSheet();hydratePhotos();greet();arrivalWatch();labelTables();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}

function kpis(){
  const t=today(),ym=t.slice(0,7);const os=[...S.orders.values()];
  const sipAy=os.filter(o=>o.type==="sipariş"&&(o.date||"").startsWith(ym)).reduce((a,o)=>a+(o.amount||0),0);
  const fatAy=os.filter(o=>o.type==="fatura"&&(o.date||"").startsWith(ym)).reduce((a,o)=>a+(o.amount||0),0);
  const w=new Date();w.setDate(w.getDate()-6);const ws=ymd(w);
  const vis=[...S.visits.values()].filter(v=>v.date>=ws).length;
  const due=custList().filter(c=>c.status!=="Pasif"&&c.nextVisit&&c.nextVisit<=t).length;
  const tg=Number(settings().target)||0;const base=Math.max(sipAy,fatAy);const pct=tg?Math.min(100,base/tg*100):0;
  return `<div class="kpis">
  <div class="kpi"><div class="l">Bu ay sipariş</div><div class="v">${tl(sipAy)}</div></div>
  <div class="kpi"><div class="l">Bu ay fatura</div><div class="v">${tl(fatAy)}</div></div>
  <div class="kpi"><div class="l">Son 7 gün ziyaret</div><div class="v">${vis}</div></div>
  <div class="kpi"><div class="l">Ziyareti gelen</div><div class="v">${due}</div></div></div>
  ${tg?`<div class="panel" style="gap:6px"><div class="row"><b>Aylık hedef</b><span class="sp"></span><span class="mono">${tl(base)} / ${tl(tg)} · %${pct.toFixed(0)}</span></div><div class="bar ${pct>=100?"ok":""}"><i style="width:${pct}%"></i></div></div>`:""}`}

function sampleCTA(){return S.customers.size?"":`<div class="empty"><b>Henüz müşteri yok.</b><span>Müşterileri tek tek ekleyebilir, Excel'den toplu yükleyebilir ya da uygulamayı denemek için örnek verileri yükleyebilirsin.</span>
  <div class="row"><button class="btn pri" data-act="goto" data-v="musteri">Müşteri ekle</button><button class="btn" data-act="sample">Örnek verileri yükle</button></div></div>`}

function n7(){if(!S.customers.size)return false;const lb=lastBackup();return !lb||daysSince(lb)>=7}
function tierBadge(c){return `<span class="tier ${esc(c.tier||"C")}" title="${esc(TIERS[c.tier||"C"])}">${esc(c.tier||"C")}</span>`}
const regions=()=>[...new Set(custList().map(c=>c.region||c.district).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));

/* ---- route / today ---- */

const DAY_DEF={home:"İnönü Mah. Cemevi Sk., Sancaktepe",homeLat:41.0112,homeLng:29.2133,dayStart:"09:00",arriveBy:"18:00",visitMin:30,speed:22,lunchFrom:"12:00",lunchTo:"13:00",lunchMin:45,lunchPlaces:[]};
const day=()=>Object.assign({},DAY_DEF,settings().day||{});
const toMin=s=>{const [h,m]=String(s||"0:0").split(":").map(Number);return (h||0)*60+(m||0)};
const hhmm=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const homePt=()=>{const D=day();return typeof D.homeLat==="number"&&typeof D.homeLng==="number"?{lat:D.homeLat,lng:D.homeLng,name:"Ev",home:true}:null};
function travelMin(a,b){const D=day();return km(a,b)*1.35/(Number(D.speed)||22)*60+5}
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const posFresh=()=>U.lastPos&&Date.now()-(U.lastPos.t||0)<15*60e3;
let _brC=null;
function buildRoute(){const D=day();const live=nowMin()>toMin(D.dayStart)-30&&nowMin()<toMin(D.arriveBy)+120;
  const here=!U.start&&live&&posFresh()&&homePt()&&km(U.lastPos,homePt())>0.3?{lat:U.lastPos.lat,lng:U.lastPos.lng,here:true}:null;
  const startMin=live?Math.max(toMin(D.dayStart),nowMin()):null;
  const key=[...U.selected].join(",")+"|"+U.start+"|"+DV+"|"+(here?here.lat.toFixed(3)+here.lng.toFixed(3):"")+"|"+(startMin==null?"":Math.floor(startMin/5))+"|"+(U.forceAll?1:0)+"|"+JSON.stringify(D);
  if(_brC&&_brC.k===key)return _brC.v;
  let ids=[...U.selected];let r=routeFor(ids,U.start,{here,startMin});const overflow=[];
  // 18:00'de evde olmak için sığmayan durakları otomatik olarak yarına bırak
  // Yolu en çok uzatan ve önceliği en düşük durağı çıkar; 18:00'e sığana kadar tekrarla
  if(!U.forceAll&&r.end){let guard=0;while(!r.plan.ok&&r.order.length&&guard++<40){
    const pts=[r.start,...r.order,r.end];let bi=-1,bs=-1;
    for(let i=1;i<pts.length-1;i++){const a=pts[i-1],c=pts[i],b=pts[i+1];const save=(a?km(a,c):0)+km(c,b)-(a?km(a,b):0);const w=save/(1+priority(c).score/40);if(w>bs){bs=w;bi=i}}
    const c=pts[bi];overflow.push(c);ids=ids.filter(id=>id!==c.id);r=routeFor(ids,U.start,{here,startMin})}}
  // Boş vakit kaldıysa çıkarılanları öncelik sırasıyla geri eklemeyi dene
  if(overflow.length&&r.plan.ok){overflow.sort((a,b)=>priority(b).score-priority(a).score);for(const c of [...overflow]){const t=routeFor([...ids,c.id],U.start,{here,startMin});if(t.plan.ok){ids.push(c.id);r=t;overflow.splice(overflow.indexOf(c),1)}}}
  r.overflow=overflow;r.live=live;_brC={k:key,v:r};return r}
function routeFor(ids,startStr,opt={}){const idset=new Set(ids);
  const sel=custList().filter(c=>idset.has(c.id));
  const geo=sel.filter(hasGeo),nogeo=sel.filter(c=>!hasGeo(c));
  const home=homePt();const start=parseCoords(startStr)||opt.here||home;const end=home;
  let order=[],rest=[...geo],cur=start;
  if(!cur&&rest.length){rest.sort((a,b)=>a.lng-b.lng);cur=rest.shift();order.push(cur)}
  while(rest.length){let bi=0,bd=1e9;rest.forEach((c,i)=>{const d=km(cur,c);if(d<bd){bd=d;bi=i}});cur=rest.splice(bi,1)[0];order.push(cur)}
  // 2-opt with fixed start and fixed end (home)
  const pts=[...(start?[start]:[]),...order,...(end?[end]:[])];const lo=start?1:0,hi=pts.length-(end?2:1);
  const seg=(i,j)=>pts[i]&&pts[j]?km(pts[i],pts[j]):0;
  let improved=true,guard=0;
  while(improved&&guard++<60){improved=false;
    for(let i=lo;i<hi;i++)for(let k=i+1;k<=hi;k++){
      const before=seg(i-1,i)+seg(k,k+1),after=seg(i-1,k)+seg(i,k+1);
      if(after+1e-6<before){pts.splice(i,k-i+1,...pts.slice(i,k+1).reverse());improved=true}}}
  order=pts.slice(lo,hi+1);
  const r={start,end,order,nogeo};r.plan=schedule(r,opt.startMin);
  let dist=0;const full=[...(start?[start]:[]),...order,...(end?[end]:[])];for(let i=1;i<full.length;i++)dist+=km(full[i-1],full[i]);r.dist=dist;
  return r}

  let t=startMin!=null?startMin:toMin(D.dayStart),prev=r.start,lunch=t>=lt-15?{skipped:true}:null;const rows=[];
  const doLunch=next=>{const L=nearestLunch(prev||next,next);let at=prev||next;let tr=0;if(L&&at){tr=travelMin(at,L);at=L}
    const s=Math.max(t+tr,lf);lunch={place:L,pos:at,start:s,end:s+lm,late:s>lt-15};t=lunch.end;if(L)prev=L;rows.push({lunch:true,...lunch})};

  const seq=[];r.plan.rows.forEach(x=>{if(x.c)seq.push(placeStr(x.c));else if(x.place)seq.push(placeStr(x.place))});
  r.nogeo.forEach(c=>seq.push(placeStr(c)));if(!seq.length)return [];

  for(let i=0;i<seq.length;i+=10){const leg=seq.slice(i,i+10);const dest=leg[leg.length-1],wps=leg.slice(0,-1);

function routeSVG(r){

  const mnLa=Math.min(...lats),mxLa=Math.max(...lats),mnLo=Math.min(...lngs),mxLo=Math.max(...lngs);
  const kx=Math.cos((mnLa+mxLa)/2*Math.PI/180);const sx=(mxLo-mnLo)*kx||0.01,sy=(mxLa-mnLa)||0.01;const s=Math.min((W-2*P)/sx,(H-2*P)/sy);

/* ---- map ---- */
const M={z:1,px:0,py:0,W:600,H:520};
function mapPoints(){return filtered().filter(hasGeo)}
function mapSVG(){const pts=mapPoints();const {W,H}=M;const P=30;
  if(!pts.length)return `<svg viewBox="0 0 ${W} ${H}" id="mapSvg"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="15">Konumu girilmiş müşteri yok</text></svg>`;
  const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);const mnLa=Math.min(...lats),mxLa=Math.max(...lats),mnLo=Math.min(...lngs),mxLo=Math.max(...lngs);
  const kx=Math.cos((mnLa+mxLa)/2*Math.PI/180);const sx=(mxLo-mnLo)*kx||0.02,sy=(mxLa-mnLa)||0.02;const s=Math.min((W-2*P)/sx,(H-2*P)/sy);
  const ox=(W-sx*s)/2,oy=(H-sy*s)/2;
  const X=p=>W/2+((ox+(p.lng-mnLo)*kx*s)-W/2)*M.z+M.px,Y=p=>H/2+((H-oy-(p.lat-mnLa)*s)-H/2)*M.z+M.py;
  // scale bar
  const kmPx=s*M.z/111.32;let sk=[0.5,1,2,5,10,20].find(k=>k*kmPx>60)||20;
  const t=today();let g="";
  // route line
  const r=buildRoute();if(r.order.length>1)g+=`<polyline points="${r.order.map(p=>X(p).toFixed(1)+","+Y(p).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
  [...pts].sort((a,b)=>(a.tier||"C")<(b.tier||"C")?1:-1).forEach(c=>{const rr={A:11,B:8,C:6}[c.tier||"C"];const x=X(c),y=Y(c);if(x<-20||y<-20||x>W+20||y>H+20)return;
    const due=c.status!=="Pasif"&&c.nextVisit&&c.nextVisit<=t;const sel=U.mapSel===c.id;const inR=U.selected.has(c.id);
    g+=`<g data-pin="${c.id}" style="cursor:pointer">${due?`<circle cx="${x}" cy="${y}" r="${rr+5}" fill="none" stroke="var(--accent)" stroke-width="2"/>`:""}<circle cx="${x}" cy="${y}" r="${rr+(sel?3:0)}" fill="${STATUS_COL[c.status||"Aday"]}" stroke="${sel||inR?"var(--ink)":"var(--surface)"}" stroke-width="${sel||inR?3:1.5}"/>${M.z>=2.2||sel?`<text x="${x+rr+4}" y="${y+4}" font-size="12" fill="var(--ink)" font-family="Barlow,sans-serif" paint-order="stroke" stroke="var(--sunk)" stroke-width="3">${esc(c.name.slice(0,26))}</text>`:""}</g>`});
  g+=`<g transform="translate(14,${H-18})"><line x1="0" y1="0" x2="${(sk*kmPx).toFixed(1)}" y2="0" stroke="var(--ink)" stroke-width="2"/><text x="0" y="-6" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${String(sk).replace(".",",")} km</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" id="mapSvg" role="img" aria-label="Müşteri konum haritası">${g}</svg>`}
function vMap(){const sel=U.mapSel?S.customers.get(U.mapSel):null;const pts=mapPoints();const noGeo=filtered().length-pts.length;
  return `<div class="row"><h2>Müşteri haritası</h2><span class="sp"></span><span class="chip st mono">${pts.length} nokta</span>${pts.length?`<button class="btn sm" data-act="addVisible">Filtredekileri rotaya ekle</button>`:""}</div>
  ${S.customers.size?filterChips():sampleCTA()}
  <div class="legend">${STATUS.map(s=>`<span><i style="background:${STATUS_COL[s]}"></i>${s}</span>`).join("")}<span><i style="border:2px solid var(--accent);background:transparent"></i>ziyaret zamanı</span><span>büyük nokta = A potansiyel</span></div>
  <div class="mapbox" id="mapBox">${mapSVG()}<div class="mapctl"><button class="btn" data-act="zin" aria-label="Yakınlaştır">+</button><button class="btn" data-act="zout" aria-label="Uzaklaştır">−</button><button class="btn" data-act="zreset" aria-label="Sığdır">⤢</button></div></div>
  ${noGeo>0?`<p class="sub">${noGeo} müşterinin konumu yok, haritada görünmüyor.</p>`:""}
  <p class="sub">Sürükleyerek gez, noktaya dokunup kartı aç. Harita kuş uçuşu konumu gösterir; yol tarifi Google Maps'te açılır.</p>
  ${sel?custCard(sel):""}`}

function loadXLSX(){if(window.XLSX)return Promise.resolve(true);if(!xlsxP)xlsxP=new Promise(r=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=()=>r(true);sc.onerror=()=>{xlsxP=null;r(false)};document.head.appendChild(sc)});return xlsxP}
async function readFile(f){toast("Dosya okunuyor…");if(!await loadXLSX()){toast("Excel okuyucu yüklenemedi. İlk seferde internet gerekir.");return}
  const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});if(!rows.length){toast("Dosyada satır bulunamadı.");return}
  const headers=Object.keys(rows[0]);const I=U.import;I.file=f.name;I.rows=rows;I.headers=headers;I.map={};
  const keys=I.kind==="customer"?["name","contact","phone","email","type","tier","status","brands","estMonthly","city","region","address","geo"]:I.kind==="product"?["sku","pname","oem","brand","price","stock"]:["customer","date","no","amount","item","qty","due","remaining"];
  keys.forEach(k=>I.map[k]=guessCol(headers,k));render()}
async function doImport(){const I=U.import;const m=I.map;
  if(I.kind==="customer"){if(!m.name){toast("Firma sütununu seç.");return}
    const out=[];I.rows.forEach(r=>{const name=String(r[m.name]||"").trim();if(!name)return;const ex=custByName(name);const g=m.geo?parseCoords(r[m.geo]):null;
      const v=k=>m[k]?String(r[m[k]]??"").trim():"";const o={name};
      ["contact","phone","email","city","region","address"].forEach(k=>{if(v(k))o[k]=v(k)});
      const ty=TYPES.find(x=>trLow(x).startsWith(trLow(v("type")).slice(0,5)));if(v("type"))o.type=ty||v("type");
      const ti=v("tier").toUpperCase().charAt(0);if("ABC".includes(ti)&&ti)o.tier=ti;
      const stt=STATUS.find(x=>trLow(x)===trLow(v("status")));if(stt)o.status=stt;
      if(v("brands"))o.brands=v("brands").split(/[,;/]+/).map(x=>x.trim()).filter(Boolean).map(x=>BRANDS.find(b=>trLow(b)===trLow(x))||(/peugeot|citro|opel|ds/i.test(x)?"PSA":x)).filter((x,i,a)=>a.indexOf(x)===i);
      if(v("estMonthly"))o.estMonthly=parseNum(v("estMonthly"));
      out.push(Object.assign({},ex||{id:uid("c"),kind:"customer",status:"Aday",tier:"B",freq:14,createdAt:Date.now()},o,g?{lat:g.lat,lng:g.lng}:{}))});
    U.import=null;await saveMany(out);toast(out.length+" müşteri kaydedildi")}
  else if(I.kind==="product"){if(!m.pname){toast("Ürün adı sütununu seç.");return}
    const out=[];I.rows.forEach(r=>{const n=String(r[m.pname]||"").trim();if(!n)return;const oem=m.oem?String(r[m.oem]||"").trim():"";const sku=m.sku?String(r[m.sku]||"").trim():"";
      const ex=products().find(p=>(sku&&normCode(p.sku)===normCode(sku))||(oem&&normCode(p.oem)===normCode(oem))||(!sku&&!oem&&trLow(p.name)===trLow(n)))||out.find(p=>sku&&normCode(p.sku)===normCode(sku));
      if(ex&&out.includes(ex)){Object.assign(ex,{name:n,oem:oem||ex.oem});return}
      out.push(Object.assign({},ex||{id:uid("p"),kind:"product"},{name:n,sku:sku||(ex&&ex.sku)||"",oem:oem||(ex&&ex.oem)||"",brand:m.brand?String(r[m.brand]||""):(ex&&ex.brand)||"",price:m.price?parseNum(r[m.price]):(ex?ex.price:""),stock:m.stock?parseNum(r[m.stock]):(ex?ex.stock:"")}))});
    const mode=I.mode;U.import=null;await saveMany(out);
    if(mode==="replace"){const keep=new Set(out.map(p=>p.id));const gone=products().filter(p=>!keep.has(p.id));if(gone.length){await removeMany(gone,`${out.length} ürün yüklendi · dosyada olmayan ${gone.length} ürün silindi`);return}}
    toast(out.length+" ürün kaydedildi")}
  else{if(!m.customer||!m.amount){toast("Müşteri ve Tutar sütunlarını seç.");return}
    const type=I.type||"sipariş";const out=[];I.rows.forEach(r=>{const cust=String(r[m.customer]||"").trim();if(!cust)return;const c=custByName(cust);
      out.push({id:uid("o"),kind:"order",type,customer:cust,customerId:c?c.id:"",date:m.date?parseDate(r[m.date]):"",no:m.no?String(r[m.no]):"",amount:parseNum(r[m.amount]),item:m.item?String(r[m.item]):"",qty:m.qty?parseNum(r[m.qty]):"",dueDate:m.due?parseDate(r[m.due]):"",remaining:m.remaining?parseNum(r[m.remaining]):"",paid:m.remaining?parseNum(r[m.remaining])<=0:false,importedFrom:I.file})});
    U.import=null;await saveMany(out);toast(out.length+" "+type+" kaydedildi")}}

async function downloadBlob(blob,fn){
  try{const f=new File([blob],fn,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[f],title:fn});return}}catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

async function geminiOnly(prompt,{system="",json=false,history=[],images=[]}={},log){

  const models=cfg.model?[cfg.model,...AI_MODELS.filter(m=>m!==cfg.model)]:AI_MODELS;
  const body={contents:[...history,{role:"user",parts:[{text:prompt},...images.map(i=>({inline_data:{mime_type:i.mime,data:i.data}}))]}],generationConfig:{temperature:json?0.2:0.5,...(json?{responseMimeType:"application/json"}:{})}};
  if(system)body.systemInstruction={parts:[{text:system}]};
  for(let round=0;round<2;round++){
   for(const m of models){
    let res;
    try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),25000);
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(cfg.key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});clearTimeout(to)}
    catch(e){log.push(m+": bağlantı kesildi");continue}

      if(!t){log.push(m+": boş yanıt ("+(d.candidates?.[0]?.finishReason||d.promptFeedback?.blockReason||"?")+")");continue}
      if(cfg.model!==m)aiSave({model:m});aiSave({last:"Gemini · "+m});return t}
    const e=await res.json().catch(()=>({}));const msg=String(e.error?.message||"").slice(0,140);log.push(m+": "+res.status+" "+msg);
    if(res.status===400&&/API key/i.test(msg)){log.push("Gemini anahtarı geçersiz");return null}

   break}
  return null}

async function fallbackAI(prompt,{system="",systemSmall="",json=false,history=[]}={},log){

      const res=await fetch(f.url+"?referrer=saha-satis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:f.model,messages,temperature:json?0.2:0.5,referrer:"saha-satis"}),signal:ctl.signal});clearTimeout(to);
      if(!res.ok){log.push(f.name+": "+res.status);continue}

function cmpVer(a,b){const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0}

  try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.update().catch(()=>{})));
  const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}

/* ---------- öğle: konumdan TokenFlex yeri bulma + bildirim ---------- */
U.lunch={pos:null,busy:false,err:"",open:false};
const NK="saha-ogle-bildirim";
function inLunchWindow(){const D=day();const n=new Date();const m=n.getHours()*60+n.getMinutes();return m>=toMin(D.lunchFrom)-30&&m<=toMin(D.lunchTo)+30}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error("Bu cihaz konum vermiyor."));
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>rej(new Error(e.code===1?"Konum izni verilmedi. Tarayıcı/uygulama ayarlarından konuma izin ver.":"Konum alınamadı, tekrar dene.")),{enableHighAccuracy:true,timeout:15000,maximumAge:120000})})}
function nearbyLunch(pos,limit=5){return (day().lunchPlaces||[]).filter(hasGeo).map(p=>({p,d:km(pos,p)})).sort((a,b)=>a.d-b.d).slice(0,limit)}
const walkMin=d=>Math.max(1,Math.round(d*1000/75));
async function locateLunch(silent){if(U.lunch.busy)return;U.lunch.busy=true;U.lunch.err="";U.lunch.open=true;if(!silent)render();
  try{U.lunch.pos=await getPos()}catch(e){U.lunch.err=e.message}U.lunch.busy=false;render();return U.lunch.pos}

  const near=L.pos?nearbyLunch(L.pos):[];const close=near.filter(x=>x.d<=2);
  const gmaps=L.pos?`https://www.google.com/maps/search/lokanta/@${L.pos.lat},${L.pos.lng},16z`:"";

   ${L.busy?`<span class="muted">Konum alınıyor…</span>`:L.err?`<div class="banner">${esc(L.err)}</div>`:""}
   ${L.pos?(close.length?`<span class="sub">Yakınındaki TokenFlex geçen yerler:</span><div class="list">${close.map(({p,d},i)=>`<div class="item stop" style="grid-template-columns:auto minmax(0,1fr) auto">${i===0?'<span class="tier A">1</span>':`<span class="tier">${i+1}</span>`}<div style="min-width:0"><div class="t">${esc(p.name)}</div><div class="meta"><span class="mono">${d<1?Math.round(d*1000)+" m":d.toFixed(1).replace(".",",")+" km"} · yürüyerek ~${walkMin(d)} dk</span></div></div><a class="btn sm pri" href="${esc("https://www.google.com/maps/dir/?api=1&travelmode=walking&destination="+p.lat+","+p.lng)}" target="_blank" rel="noopener">Git</a></div>`).join("")}</div>`
     :`<div class="banner">2 km içinde kayıtlı TokenFlex yeri yok${near[0]?` (en yakını ${esc(near[0].p.name)}, ${near[0].d.toFixed(1).replace(".",",")} km)`:""}. Aşağıdan yakındaki lokantalara bak; TokenFlex uygulamasında “Üye iş yerleri”nden kontrol et.</div>`)
     +`<div class="row"><a class="btn sm" href="${esc(gmaps)}" target="_blank" rel="noopener">Yakındaki lokantalar (Maps)</a></div>
       <form id="lunchHere" class="row"><input id="lh_name" name="name" placeholder="Şu an bulunduğum yerin adı" style="flex:1 1 180px" required><button class="btn sm" type="submit">＋ Burada TokenFlex geçiyor</button></form>
       <span class="why">Yemek yediğin yerde TokenFlex geçtiyse adını yazıp kaydet; bir dahaki sefere otomatik önerilir.</span>`
    :`<span class="sub">Bulunduğun yere en yakın TokenFlex geçen yeri göstermem için “Yakınımda ara”ya bas.</span>`}
   ${notifRow()}</section>`}
function notifState(){if(!("Notification" in window))return "yok";return Notification.permission}
function notifRow(){const st=notifState();if(st==="granted")return `<span class="why">🔔 Öğle bildirimi açık. Uygulama arka planda açıksa ${esc(day().lunchFrom)}'da en yakın yeri bildiririm.</span>`;
  if(st==="yok")return "";if(st==="denied")return `<span class="why">Bildirim izni kapalı; tarayıcı ayarlarından açabilirsin.</span>`;
  return `<div class="row"><button class="btn sm" data-act="notifOn">🔔 Saat ${esc(day().lunchFrom)}'da bildirim gönder</button></div>`}
async function notifyLunch(force){try{
  const t=today();if(!force&&localStorage.getItem(NK)===t)return;if(notifState()!=="granted")return;
  let pos=U.lunch.pos;try{pos=await getPos();U.lunch.pos=pos}catch(e){}
  const n=pos?nearbyLunch(pos,1)[0]:null;
  const body=n&&n.d<=2?`${n.p.name} burada, ${n.d<1?Math.round(n.d*1000)+" m":n.d.toFixed(1).replace(".",",")+" km"} uzakta (yürüyerek ~${walkMin(n.d)} dk). Dokun, yol tarifini aç.`:"Öğle arası. Yakındaki TokenFlex geçen yerleri görmek için dokun.";
  const reg=await navigator.serviceWorker?.getRegistration?.();const opts={body,icon:"icon-192.png",badge:"icon-192.png",tag:"ogle",data:{url:location.pathname+"#ogle",dest:n&&n.d<=2?`https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${n.p.lat},${n.p.lng}`:""}};
  if(reg)await reg.showNotification("🍽 TokenFlex: öğle arası",opts);else new Notification("🍽 TokenFlex: öğle arası",opts);
  localStorage.setItem(NK,t)}catch(e){}}
function scheduleLunchNotif(){clearTimeout(U._lt);const D=day();const n=new Date();const target=new Date(n);const [h,m]=D.lunchFrom.split(":").map(Number);target.setHours(h,m,0,0);
  const dow=n.getDay();if(dow===0)return; // pazar yok
  const diff=target-n;if(diff>0&&diff<12*3600e3)U._lt=setTimeout(()=>notifyLunch(false),diff);
  else if(inLunchWindow())notifyLunch(false)}

/* ---------- adres bulma (OpenStreetMap, ücretsiz) ---------- */
const dirLink=c=>"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(placeStr(c)||c.name);
let geoLast=0;async function geoWait(){const w=1100-(Date.now()-geoLast);if(w>0)await sleep(w);geoLast=Date.now()}
async function reverseGeo(lat,lng){await geoWait();
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=tr&addressdetails=1&zoom=18`);if(!r.ok)throw new Error("Adres bulunamadı");
  const d=await r.json();const a=d.address||{};
  const street=[a.road||a.pedestrian||a.street,a.house_number?"No:"+a.house_number:""].filter(Boolean).join(" ");
  const mah=a.quarter||a.neighbourhood||a.suburb||"";
  return {address:[mah&&mah!==street?mah:"",street,a.industrial||""].filter(Boolean).join(", ")||d.display_name?.split(",").slice(0,3).join(","),
    region:a.town||a.city_district||a.district||a.county||a.suburb||"",city:a.province||a.city||a.state||"",name:d.name||a.shop||a.amenity||""}}
async function forwardGeo(q){await geoWait();
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=tr&accept-language=tr&q=${encodeURIComponent(q)}`);if(!r.ok)return null;
  const d=await r.json();return d[0]?{lat:+(+d[0].lat).toFixed(6),lng:+(+d[0].lon).toFixed(6)}:null}
async function searchPlaces(q){const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=41.02&lon=29.0&limit=6`);if(!r.ok)return [];
  const d=await r.json();return (d.features||[]).filter(f=>(f.properties.countrycode||"TR")==="TR").map(f=>{const p=f.properties;const [lng,lat]=f.geometry.coordinates;
    return {name:p.name||"",address:[p.locality||p.district,p.street,p.housenumber?"No:"+p.housenumber:""].filter(Boolean).join(", "),region:p.county||p.city||"",city:p.state||p.city||"",lat:+lat.toFixed(6),lng:+lng.toFixed(6)}})}
function setVal(id,v,onlyEmpty){const el=document.getElementById(id);if(!el||!v)return;if(onlyEmpty&&el.value.trim())return;el.value=v}
async function fillAddrFrom(lat,lng){try{const a=await reverseGeo(lat,lng);setVal("cf_addr",a.address);setVal("cf_region",a.region);setVal("cf_city",a.city);setVal("cf_name",a.name,true);toast("Adres bulundu: "+[a.region,a.city].filter(Boolean).join(", "))}catch(e){toast("Konum alındı ama adres bulunamadı; elle yazabilirsin.")}}
async function addrSearch(q){const box=$("#addrHits");if(!box)return;q=q.trim();if(q.length<3){box.innerHTML="";return}
  box.innerHTML=`<span class="why">Aranıyor…</span>`;let hits=[];try{hits=await searchPlaces(q+" İstanbul")}catch(e){}

async function geocodeMissing(btn){const miss=custList().filter(c=>!hasGeo(c)&&(c.address||c.region||c.district));if(!miss.length){toast("Konumu eksik müşteri yok");return}

/* ---------- gün aşırı plan: Avrupa / Anadolu dönüşümlü, evden çıkış-eve dönüş ---------- */
const side=c=>{const lng=c.lng,lat=c.lat;const cut=lat>41.07?29.06:lat>41.03?29.02:29.01;return lng<cut?"Avrupa":"Anadolu"};
function planDays(n){const out=[];const d=new Date();if(d.getHours()>=11)d.setDate(d.getDate()+1);while(out.length<n){if(d.getDay()!==0)out.push(new Date(d));d.setDate(d.getDate()+1)}
  return out.map(x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"))}
const DAYN=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
function buildPlan(){const cs=custList().filter(c=>hasGeo(c)&&c.status!=="Pasif");const days=planDays(6);
  const pr=c=>priority(c).score;const bySide={Avrupa:[],Anadolu:[]};cs.forEach(c=>bySide[side(c)].push(c));
  const weight=s=>bySide[s].reduce((a,c)=>a+pr(c),0);let cur=weight("Avrupa")>=weight("Anadolu")?"Avrupa":"Anadolu";
  const used=new Map();const plan=[];
  for(const date of days){
    const pool=bySide[cur].filter(c=>{const last=used.get(c.id);const f=Number(c.freq)||14;return !last||daysBetween(last,date)>=Math.max(2,f)}).sort((a,b)=>pr(b)-pr(a));
    pool.splice(40);const chosen=[];let fails=0;
    while(pool.length&&fails<6){let best=-1,bs=-1e9;pool.forEach((c,i)=>{const dmin=chosen.length?Math.min(...chosen.map(x=>km(x,c))):0;const sc=pr(c)-dmin*4;if(sc>bs){bs=sc;best=i}});
      const c=pool.splice(best,1)[0];const r=routeFor([...chosen,c].map(x=>x.id),null);if(r.plan.ok&&r.plan.rows.filter(x=>x.c).length===chosen.length+1){chosen.push(c);fails=0}else fails++;if(chosen.length>=12)break}
    chosen.forEach(c=>used.set(c.id,date));
    const r=routeFor(chosen.map(c=>c.id),null);
    plan.push({date,side:cur,ids:r.order.map(c=>c.id),homeAt:r.plan.homeAt,km:r.dist});
    cur=cur==="Avrupa"?"Anadolu":"Avrupa"}
  return plan}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function planPanel(){const P=(settings().plan)||null;
  if(!P||!P.days)return `<section class="panel"><div class="row"><h2>Gün aşırı plan</h2></div><span class="sub">Önümüzdeki 6 iş gününü Avrupa ve Anadolu yakası dönüşümlü olacak şekilde planlarım. Her gün evden çıkıp ${esc(day().arriveBy)}'da eve dönen bir rota olur; öncelikli ve yakın müşteriler aynı güne toplanır.</span><div class="row"><button class="btn pri" data-act="mkPlan">Planı oluştur</button></div></section>`;
  const t=today();
  return `<section class="panel"><div class="row"><h2>Gün aşırı plan</h2><span class="sp"></span><button class="btn sm" data-act="mkPlan">Yeniden oluştur</button></div>
   <div class="list">${P.days.map((d,i)=>{const dt=new Date(d.date);const names=d.ids.map(id=>S.customers.get(id)).filter(Boolean);
     return `<div class="item" ${d.date===t?'style="border-color:var(--accent)"':""}><div class="row"><b>${DAYN[dt.getDay()]} ${fmtDate(d.date).slice(0,5)}</b><span class="chip ${d.side==="Avrupa"?"st":"warn"}">${d.side} yakası</span><span class="chip mono">${names.length} durak</span>${names.length?`<span class="chip ok mono">eve ${hhmm(d.homeAt)}</span>`:""}<span class="sp"></span>${names.length?`<button class="btn sm ${d.date===t?"pri":""}" data-act="loadPlan" data-i="${i}">Rotaya yükle</button>`:""}</div>
      <div class="why">${names.length?esc(names.map(c=>c.name).join(" → ")):"Bu yakada sırası gelen müşteri yok."}</div></div>`}).join("")}</div>
   <span class="why">Bir müşterinin plana tekrar girmesi için “ziyaret sıklığı” gününün geçmesi gerekir; 2 yazarsan gün aşırı her turda gelir.</span></section>`}

/* Fotoğraflar (telefonun kendi deposunda, IndexedDB) */
let _idb=null;function idb(){if(_idb)return _idb;_idb=new Promise((res,rej)=>{const r=indexedDB.open("saha-foto",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return _idb}
async function photoPut(id,data){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("f","readwrite");t.objectStore("f").put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function photoGet(id){const db=await idb();return new Promise(res=>{const r=db.transaction("f").objectStore("f").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}
function shrink(file,max=1280,q=.72){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);res(cv.toDataURL("image/jpeg",q))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
U.pendingPhotos=[];
async function addPhotos(files){for(const f of files){try{const d=await shrink(f);const id=uid("ph");await photoPut(id,d);U.pendingPhotos.push(id)}catch(e){toast("Fotoğraf eklenemedi")}}
  const box=$("#vfPhotos");if(box)box.innerHTML=U.pendingPhotos.map(id=>`<img data-ph="${id}" alt="Fotoğraf">`).join("");hydratePhotos()}
async function hydratePhotos(){for(const im of document.querySelectorAll("img[data-ph]:not([src])")){const d=await photoGet(im.dataset.ph);if(d)im.src=d;else im.alt="Bu cihazda yok"}}

    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});

      .filter(x=>x.name&&x.lat).filter(x=>!cs.some(c=>trLow(c.name)===trLow(x.name)||(hasGeo(c)&&km(c,x)<0.05))).sort((a,b)=>(a.kind==="Yedek parçacı"?0:1)-(b.kind==="Yedek parçacı"?0:1)||a.d-b.d);

function dayReport(date){date=date||today();const vs=[...S.visits.values()].filter(v=>v.date===date).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  const os=[...S.orders.values()].filter(o=>o.date===date&&o.type==="sipariş");const newC=custList().filter(c=>c.createdAt&&ymd(new Date(c.createdAt))===date);
  const res={};vs.forEach(v=>res[v.result]=(res[v.result]||0)+1);const amt=os.reduce((s,o)=>s+(o.amount||0),0);
  const pts=vs.map(v=>S.customers.get(v.customerId)).filter(hasGeo);const home=homePt();let dist=0;const path=[...(home?[home]:[]),...pts,...(home?[home]:[])];for(let i=1;i<path.length;i++)dist+=km(path[i-1],path[i])*1.35;
  return {date,vs,os,newC,res,amt,dist}}
function reportText(R){return `Gün sonu raporu · ${fmtDate(R.date)}\nZiyaret: ${R.vs.length}${Object.keys(R.res).length?" ("+Object.entries(R.res).map(([k,n])=>k+" "+n).join(", ")+")":""}\nSipariş: ${R.os.length} adet · ${tl(R.amt)}\nYeni aday: ${R.newC.length}\nYol: ~${Math.round(R.dist)} km\n\n`+R.vs.map(v=>{const c=S.customers.get(v.customerId);return `• ${v.start||""} ${c?c.name:v.customerName} – ${v.result}${v.amount?" "+tl(v.amount):""}${v.note?": "+v.note.slice(0,90):""}`}).join("\n")+`\n${msgCfg().sender||""}`}

/* Otomatik varış algılama: Bugün ekranı açıkken rotadaki bir müşteriye 150 m yaklaşınca sorar */
let _watch=null;
function ensurePos(){if(U.tab!=="rota"||posFresh()||U._posBusy||!("geolocation" in navigator))return;U._posBusy=true;
  getPos().then(p=>{U.lastPos=Object.assign(p,{t:Date.now()});learnHome(p);U._posBusy=false;render()}).catch(()=>{U._posBusy=false;U._posFail=Date.now()})}
function arrivalWatch(){if(!U._posFail||Date.now()-U._posFail>10*60e3)ensurePos();const want=U.tab==="rota"&&!U.detail&&U.selected.size>0&&document.visibilityState==="visible"&&"geolocation" in navigator;
  if(want&&_watch==null){_watch=navigator.geolocation.watchPosition(p=>{const pos={lat:p.coords.latitude,lng:p.coords.longitude,t:Date.now()};U.lastPos=pos;
      const t=today();const hit=custList().filter(c=>U.selected.has(c.id)&&hasGeo(c)&&km(pos,c)<0.15&&!visitsOf(c).some(v=>v.date===t))[0];
      if(hit&&U.arrived!==hit.id&&!(U.live&&U.live.customerId===hit.id)){U.arrived=hit.id;render()}},()=>{},{enableHighAccuracy:true,maximumAge:30000,timeout:20000})}
  else if(!want&&_watch!=null){navigator.geolocation.clearWatch(_watch);_watch=null}}
function homeBanner(){if(U.tab!=="rota"||U.detail)return "";const D=day();const H=homePt();let out="";
  if(U.homeSuggest){const g=U.homeSuggest;out+=`<div class="panel" style="border-color:var(--accent)"><b>🏠 Evini konumundan algıladım</b><span class="sub">Son ${g.n} akşam aynı yerdeydin (${g.lat.toFixed(4)}, ${g.lng.toFixed(4)}). Günü buraya dönecek şekilde planlayayım mı?</span><div class="row"><button class="btn pri sm" data-act="homeYes">Evet, evim burası</button><button class="btn ghost sm" data-act="homeNo">Hayır</button></div></div>`}
  if(!H||!posFresh())return out;const d=km(U.lastPos,H);if(d<0.4)return out;
  const back=Math.round(travelMin(U.lastPos,H));const by=toMin(D.arriveBy);const leave=by-back;const n=nowMin();
  if(n<leave-45||n>by+90)return out;
  const late=n>leave;return out+`<div class="hero" style="${late?"background:linear-gradient(135deg,#e0293a,#ff6b5f)":""}"><span style="font-size:13px;opacity:.9">🏠 Eve dönüş</span><b style="font-size:18px">${late?`${esc(D.arriveBy)}'e yetişmek için çıkman gerekiyordu`:`${esc(D.arriveBy)}'de evde olmak için en geç ${hhmm(leave)}'de çık`}</b><span style="font-size:13px;opacity:.9">Buradan eve ~${back} dk · ${d.toFixed(1).replace(".",",")} km</span><div class="row"><a class="btn" style="background:#fff;color:var(--navy);border:0" href="${esc(dirLink(H))}" target="_blank" rel="noopener">Eve yol tarifi</a></div></div>`}
const GK="saha-gece";
function learnHome(p){try{const h=new Date().getHours();if(!(h>=20||h<7)||!p||(p.acc&&p.acc>200))return;const L=JSON.parse(localStorage.getItem(GK)||"[]").filter(x=>x.d!==today());L.push({d:today(),lat:p.lat,lng:p.lng});
  localStorage.setItem(GK,JSON.stringify(L.slice(-30)));detectHome()}catch(e){}}
function detectHome(){try{const L=JSON.parse(localStorage.getItem(GK)||"[]");if(L.length<3)return;let best=null;
  for(const a of L){const near=L.filter(b=>km(a,b)<0.3);if(!best||near.length>best.length)best=near}
  if(!best||best.length<3)return;const c={lat:best.reduce((s,x)=>s+x.lat,0)/best.length,lng:best.reduce((s,x)=>s+x.lng,0)/best.length,n:best.length};
  const H=homePt();const no=JSON.parse(localStorage.getItem(GK+"-hayir")||"[]");
  if(H&&km(c,H)<0.4)return;if(no.some(x=>km(x,c)<0.4))return;U.homeSuggest=c}catch(e){}}
function nightCheck(){const h=new Date().getHours();if(!(h>=20||h<7))return;
  if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"geolocation"}).then(st=>{if(st.state==="granted")getPos().then(learnHome).catch(()=>{})}).catch(()=>{})}
function scheduleHomeNotif(){clearTimeout(U._ht);if(!posFresh()||notifState()!=="granted")return;const H=homePt();if(!H)return;
  const leave=toMin(day().arriveBy)-Math.round(travelMin(U.lastPos,H))-15;const ms=(leave-nowMin())*60e3;
  if(ms>0&&ms<6*3600e3)U._ht=setTimeout(async()=>{if(localStorage.getItem("saha-eve-bildirim")===today())return;const reg=await navigator.serviceWorker?.getRegistration?.();
    const o={body:`${day().arriveBy}'de evde olmak için 15 dakika içinde yola çık.`,icon:"icon-192.png",tag:"eve",data:{dest:dirLink(H)}};if(reg)reg.showNotification("🏠 Eve dönüş zamanı",o);else new Notification("🏠 Eve dönüş zamanı",o);localStorage.setItem("saha-eve-bildirim",today())},ms)}

/* ---------- bulut eşitleme + tek seferlik giriş (Firebase) ---------- */
const FB_CONFIG=null; // Firebase projesi bağlanınca doldurulur
const FBV="10.12.2";
const CLOUD={on:false,ready:false,user:null,db:null,col:null,unsub:null,last:0,err:"",synced:0,busy:false};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("yüklenemedi"));document.head.appendChild(s)})}
const cleanDoc=d=>JSON.parse(JSON.stringify(d));
async function cloudInit(){if(!FB_CONFIG)return;CLOUD.on=true;render();
  try{for(const m of ["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${m}-compat.js`)}
  catch(e){CLOUD.on=false;CLOUD.err="Bulut bağlantısı kurulamadı; bu cihazdaki kayıtlarla çalışıyorsun.";render();return}

function syncMeta(uid,patch){const k="saha-sync-"+uid;let m={};try{m=JSON.parse(localStorage.getItem(k)||"{}")}catch(e){}if(patch){m=Object.assign(m,patch);try{localStorage.setItem(k,JSON.stringify(m))}catch(e){}}return m}
const tsMs=v=>v&&typeof v.toMillis==="function"?v.toMillis():0;
function applyRemote(d){const {_u,_del,...rest}=d;if(!rest.id||!rest.kind)return;if(_del)bucket(rest.kind).delete(rest.id);else bucket(rest.kind).set(rest.id,rest);DV++}
async function cloudStart(u){CLOUD.col=CLOUD.db.collection("users").doc(u.uid).collection("items");const meta=syncMeta(u.uid);CLOUD.busy=true;render();
  try{
    if(!meta.migrated){ // bu cihazda ilk giriş: buluttakileri al, sadece bu cihazda olanları yükle
      const snap=await CLOUD.col.get();const cloudIds=new Set();let mx=0;
      snap.forEach(doc=>{const d=doc.data();cloudIds.add(doc.id);mx=Math.max(mx,tsMs(d._u));applyRemote(d)});
      const local=[...S.customers.values(),...S.visits.values(),...S.orders.values(),...S.settings.values(),...S.products.values()].filter(d=>!cloudIds.has(d.id));
      await cloudPush(local);syncMeta(u.uid,{migrated:true,last:mx});lsSave();toast(local.length?`${local.length} kayıt buluta yüklendi`:"Bulut kayıtları bu cihaza alındı")}
    cloudListen(u)}
  catch(e){CLOUD.err="Eşitleme başlatılamadı: "+(e.message||e.code)}
  CLOUD.busy=false;render()}
function cloudListen(u){if(CLOUD.unsub)CLOUD.unsub();const last=syncMeta(u.uid).last||0;
  CLOUD.unsub=CLOUD.col.where("_u",">",firebase.firestore.Timestamp.fromMillis(last)).onSnapshot(snap=>{let mx=syncMeta(u.uid).last||0,n=0;
    snap.docChanges().forEach(ch=>{if(ch.type==="removed")return;if(ch.doc.metadata.hasPendingWrites)return;const d=ch.doc.data();mx=Math.max(mx,tsMs(d._u));applyRemote(d);n++});
    if(n){syncMeta(u.uid,{last:mx});lsSave();clearTimeout(CLOUD._rt);CLOUD._rt=setTimeout(()=>{if(!document.querySelector("form input:focus,form textarea:focus,form select:focus"))render()},150)}
    CLOUD.synced=Date.now();setSync()},e=>{CLOUD.err="Eşitleme durdu: "+(e.message||e.code);render()})}
function cloudStop(){if(CLOUD.unsub)CLOUD.unsub();CLOUD.unsub=null;CLOUD.col=null}
async function cloudPush(list,del){if(!CLOUD.col||!list.length)return;const ts=firebase.firestore.FieldValue.serverTimestamp();
  for(let i=0;i<list.length;i+=400){const b=CLOUD.db.batch();list.slice(i,i+400).forEach(d=>b.set(CLOUD.col.doc(d.id),del?{id:d.id,kind:d.kind,_del:true,_u:ts}:Object.assign(cleanDoc(d),{_del:false,_u:ts})));
    b.commit().catch(e=>{CLOUD.err="Buluta yazılamadı: "+(e.message||e.code);setSync()})}}

const normCode=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
let _pix=null;function prodIndex(){if(_pix&&_pix.v===DV)return _pix;const byCode=new Map();for(const p of S.products.values()){for(const c of [p.sku,p.oem]){const k=normCode(c);if(k.length>=3)byCode.set(k,p)}}_pix={v:DV,byCode};return _pix}
const lowOf=p=>p.stock!==""&&p.stock!=null&&Number(p.stock)<=(p.min!==""&&p.min!=null?Number(p.min):5);
// Metindeki stok kodlarını bul: boşluk, nokta, tire ile yazılmış kodları da tanır (1K0 698 151 = 1K0698151)
function findCodes(text){const ix=prodIndex().byCode;const toks=String(text||"").toUpperCase().split(/[\s,;\/|+]+/).map(t=>t.replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/g,"")).filter(Boolean);
  const hits=new Map(),unknown=new Set();const used=new Set();
  for(let n=4;n>=1;n--)for(let i=0;i+n<=toks.length;i++){if([...Array(n).keys()].some(k=>used.has(i+k)))continue;const k=normCode(toks.slice(i,i+n).join(""));
    if(k.length>=3&&ix.has(k)&&(k.length>=5||/\d/.test(k))){const p=ix.get(k);hits.set(p.id,{p,raw:toks.slice(i,i+n).join(" ")});for(let j=0;j<n;j++)used.add(i+j)}}
  toks.forEach((t,i)=>{if(used.has(i))return;const k=normCode(t);if(k.length>=6&&/\d/.test(k)&&/[A-Z]/.test(k)||/^\d{7,13}$/.test(k))unknown.add(t)});
  return {hits:[...hits.values()],unknown:[...unknown].slice(0,6)}}
function codeChips(text,ctx){const r=findCodes(text);if(!r.hits.length&&!r.unknown.length)return "";
  return `<div class="chips" style="margin-top:6px">${r.hits.map(h=>`<span class="chip nc ${lowOf(h.p)?"warn":"ok"}" title="${esc(h.p.name)}">✓ ${esc(h.p.sku||h.p.oem)} · ${esc(h.p.name.slice(0,24))} · ${h.p.stock===""||h.p.stock==null?"stok ?":esc(h.p.stock)+" ad."}${h.p.price?" · "+tl(h.p.price):""}</span>${ctx==="cart"?`<button class="fchip" data-act="cartAdd" data-id="${h.p.id}">+ sepete</button>`:""}`).join("")}${r.unknown.map(u=>`<span class="chip nc">? ${esc(u)} stokta kayıtlı değil</span>`).join("")}</div>`}
function prodSales(p){let q=0,n=0;const who=new Map();for(const o of S.orders.values()){for(const l of (o.lines||[])){if(l.pid===p.id||(p.oem&&normCode(l.oem)===normCode(p.oem))){q+=l.qty;n++;const c=o.customerId&&S.customers.get(o.customerId);if(c)who.set(c.id,(who.get(c.id)||0)+l.qty)}}}
  return {q,n,who:[...who.entries()].sort((a,b)=>b[1]-a[1]).map(([id,q])=>({c:S.customers.get(id),q}))}}
function matchProducts(q){const k=normCode(q),t=trLow(q);if(!q)return products();return products().filter(p=>(k.length>=2&&(normCode(p.sku).includes(k)||normCode(p.oem).includes(k)))||trLow([p.name,p.brand].join(" ")).includes(t))}

function findProdByCode(code){const k=normCode(code);return prodIndex().byCode.get(k)||products().find(p=>normCode(p.sku)===k||normCode(p.oem)===k)||null}
function findCust(n){return custByName(n)||custList().find(c=>trLow(c.name).includes(trLow(n))||trLow(n).includes(trLow(c.name)))||null}
function parseActions(t){const m=String(t).match(/<eylem>([\s\S]*?)<\/eylem>/i)||String(t).match(/```(?:json|eylem)?\s*(\{[\s\S]*?"actions"[\s\S]*?\})\s*```/i);if(!m)return null;const o=aiJSON(m[1]);return o&&Array.isArray(o.actions)?o.actions:null}
function planActions(acts){const steps=[];const miss=[];
  for(const a of acts||[]){try{
    if(a.type==="delete_products"){let ps=[];if(a.filter==="zero")ps=products().filter(p=>p.stock!==""&&p.stock!=null&&Number(p.stock)<=0);else if(a.filter==="sample")ps=products().filter(isSample);else if(a.filter==="critical")ps=products().filter(lowOf);else if(a.filter==="all")ps=products();
      (a.codes||[]).forEach(c=>{const p=findProdByCode(c);if(p)ps.push(p);else miss.push(c)});ps=[...new Set(ps)];if(ps.length)steps.push({kind:"del",items:ps,text:`${ps.length} ürünü stoktan sil: ${ps.slice(0,6).map(p=>p.sku||p.oem||p.name).join(", ")}${ps.length>6?"…":""}`})}
    else if(a.type==="set_stock"||a.type==="adjust_stock"||a.type==="set_price"){const p=findProdByCode(a.code);if(!p){miss.push(a.code);continue}
      const nv=a.type==="set_price"?{price:Number(a.price)}:{stock:a.type==="set_stock"?Math.max(0,Number(a.stock)):Math.max(0,(Number(p.stock)||0)+Number(a.delta))};
      steps.push({kind:"save",items:[Object.assign({},p,nv)],text:a.type==="set_price"?`${p.sku||p.oem||p.name} fiyatı: ${tl(p.price)} → ${tl(nv.price)}`:`${p.sku||p.oem||p.name} stoğu: ${p.stock??"?"} → ${nv.stock}`})}
    else if(a.type==="add_product"){if(!a.name){continue}const ex=(a.sku&&findProdByCode(a.sku))||(a.oem&&findProdByCode(a.oem));if(ex){miss.push((a.sku||a.oem)+" zaten var");continue}
      steps.push({kind:"save",items:[{id:uid("p"),kind:"product",name:String(a.name),sku:String(a.sku||""),oem:String(a.oem||""),brand:String(a.brand||""),price:Number(a.price)||"",stock:a.stock===undefined?"":Number(a.stock),min:5}],text:`Yeni ürün: ${a.sku?"["+a.sku+"] ":""}${a.name}`})}
    else if(a.type==="add_route"){const cs=(a.customers||[]).map(n=>findCust(n)||(miss.push(n),null)).filter(Boolean);if(cs.length)steps.push({kind:"route",ids:cs.map(c=>c.id),text:`Rotaya ekle: ${cs.map(c=>c.name).join(", ")}`})}
    else if(a.type==="mark_paid"){(a.customers||[]).forEach(n=>{const c=findCust(n);if(!c){miss.push(n);return}const inv=overdueList().find(g=>g.c&&g.c.id===c.id);if(inv)steps.push({kind:"save",items:inv.inv.map(o=>Object.assign({},o,{paid:true,paidAt:today()})),text:`${c.name}: ${inv.inv.length} fatura ödendi (${tl(inv.total)})`});else miss.push(n+" için geciken fatura yok")})}
    else if(a.type==="set_next_visit"){const c=findCust(a.customer);if(!c||!/^\d{4}-\d{2}-\d{2}$/.test(a.date||"")){miss.push(a.customer);continue}steps.push({kind:"save",items:[Object.assign({},c,{nextVisit:a.date})],text:`${c.name} sonraki ziyaret: ${fmtDate(a.date)}`})}
    else if(a.type==="add_customer"){if(!a.name||findCust(a.name)){miss.push((a.name||"?")+" zaten var");continue}steps.push({kind:"save",items:[{id:uid("c"),kind:"customer",name:String(a.name),phone:String(a.phone||""),region:String(a.region||""),contact:String(a.contact||""),status:"Aday",tier:"B",freq:14,createdAt:Date.now()}],text:`Yeni müşteri: ${a.name}`})}
  }catch(e){}}
  return {steps,miss}}
async function applyPlan(P){let n=0;const dels=[];for(const s of P.steps){if(s.kind==="del"){dels.push(...s.items)}else if(s.kind==="save"){await saveMany(s.items);n+=s.items.length}else if(s.kind==="route"){s.ids.forEach(id=>U.selected.add(id));keepUI();n+=s.ids.length}}
  if(dels.length)await removeMany(dels,`${dels.length} ürün silindi`+(n?` · ${n} işlem yapıldı`:""));else toast(`${n} işlem uygulandı`)}
// Yapay zekâ olmadan da cevap: stok kodu ve kritik stok soruları
function localAnswer(q){const r=findCodes(q);const lines=[];
  r.hits.forEach(h=>{const p=h.p;lines.push(`• ${p.sku?"["+p.sku+"] ":""}${p.name}${p.oem?" · OEM "+p.oem:""} — stok: ${p.stock===""||p.stock==null?"bilinmiyor":p.stock+" adet"}${p.price?" · "+tl(p.price):""}${lowOf(p)?" · KRİTİK":""}`)});
  r.unknown.forEach(u=>lines.push(`• ${u} — stok listesinde kayıtlı değil`));
  if(/kritik|azal|biten|bitmek/i.test(q)){const L=products().filter(lowOf);lines.push(L.length?"Kritik stoktaki ürünler:\n"+L.slice(0,30).map(p=>`• ${p.sku||p.oem||""} ${p.name}: ${p.stock} adet`).join("\n"):"Kritik seviyede ürün yok.")}
  return lines.join("\n")}

document.addEventListener("pointerdown",e=>{const svg=e.target.closest("#mapSvg");if(!svg)return;drag={x:e.clientX,y:e.clientY,px:M.px,py:M.py,k:M.W/svg.getBoundingClientRect().width};M.dragged=false});
document.addEventListener("pointermove",e=>{if(!drag)return;const dx=(e.clientX-drag.x)*drag.k,dy=(e.clientY-drag.y)*drag.k;if(Math.abs(dx)+Math.abs(dy)>6)M.dragged=true;if(M.dragged){M.px=drag.px+dx;M.py=drag.py+dy;if(!M.raf)M.raf=requestAnimationFrame(()=>{M.raf=0;redrawMap()})}});
